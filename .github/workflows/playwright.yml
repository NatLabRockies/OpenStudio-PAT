name: Playwright Tests
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - develop
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install build dependencies (package-lock.json)
        run: npm ci
      - name: Install build dependencies (app/package-lock.json)
        working-directory: app
        run: npm ci
      - name: Install Electron system dependencies
        run: |
          pkgs="libgtk-3-0t64 libnss3 libatk1.0-0t64
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
            libpango-1.0-0 libcairo2 libasound2t64 libatspi2.0-0t64
            libdbus-1-3 libxcursor1 libxi6 libxinerama1 libxext6
            libxrender1 libx11-xcb1 xvfb"
          # The runner image usually has these already; only touch apt (and its mirror) for missing ones.
          missing=$(for p in $pkgs; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || echo "$p"
          done)
          if [ -z "$missing" ]; then
            echo "All Electron system dependencies are installed; skipping apt."
          else
            echo "Installing missing packages:" $missing
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y $missing
          fi
      - name: Cache runtime dependencies
        id: cache-runtime-deps
        uses: actions/cache@v4
        with:
          path: depend/
          key: ${{ runner.os }}-${{ hashFiles('manifest.json', 'tasks/build.js') }}
      - name: Install runtime dependencies
        if: ${{ steps.cache-runtime-deps.outputs.cache-hit != 'true' }}
        run: npx gulp installDeps
      - name: Build application
        run: npm run test:build
      - name: Prepare tmp test files
        run: npm run test:tmpFiles
      # xvfb-run directly: coactions/setup-xvfb apt-installs x11-xserver-utils on every run.
      - name: Run playwright tests
        run: |
          xvfb-run --auto-servernum npm run test:parallel
          xvfb-run --auto-servernum npm run test:serial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/playwright/
          retention-days: 30
